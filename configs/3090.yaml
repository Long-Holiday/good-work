# 所有数值均为未实测的实验起点；模型几何固定为 SAM 1024 / 热图 256。
seed: 42
output_dir: runs/diffpeak

data:
  root: DeepGlobe_Road
  train_split: splits/train.json
  val_split: splits/val.json
  num_workers: 4
  augment: true
  heatmap_sigma: 1.0
  target_min_distance: 4.0
  sampling_config:
    positive:
      min_spacing: 24.0
      max_spacing: 64.0
      junction_probability: 0.5
      endpoint_probability: 0.5
      min_branch_length: 4.0
    negative:
      boundary_margin: 2.0
      boundary_band: 12.0
      boundary_count: [8, 20]
      background_count: [4, 12]
      min_separation: 12.0

model:
  sam_checkpoint: checkpoints/sam_vit_b_01ec64.pth
  gradient_checkpointing: true

diffusion:
  timesteps: 1000
  sampling_steps: 20
  min_std: 0.02

# A–D 及推理共享；进入 D 后不要单独修改。
peaks:
  sigma: 0.5
  h: 0.05
  threshold: 0.3
  min_distance: 4

train:
  batch_size: 1
  accumulation_steps: 4
  amp: true
  weight_decay: 0.01
  grad_clip: 1.0
  heat_weight: 0.1
  aux_weight: 0.2
  cldice_weight: 0.2
  save_every: 1

stages:
  A: {epochs: 15, lr: 0.0001}
  B: {epochs: 60, lr: 0.0001}
  C: {epochs: 10, lr: 0.00005}
  D: {epochs: 10, lr: 0.000003}

rl:
  group_size: 4
  # 高维动作使用联合 log-prob 的 sum，不用 mean 偷换目标。
  ppo_clip: 0.0001
  kl_weight: 0.01
  anchor_weight: 0.1
  update_epochs: 1
  amp_init_scale: 64.0

reward:
  iou_weight: 0.6
  cldice_weight: 0.4
  path_weight: 0.0
  point_cost: 0.05
  point_reference: 32
  path_samples: 32
  path_match_radius: 8

inference:
  threshold: 0.5
