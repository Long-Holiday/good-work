# 单通道有符号道路山脊场；旧双通道快照禁止直接 resume。
training_protocol: signed_ridge_v1
target_representation: signed_ridge_v1
sam_frozen: true
seed: 42
output_dir: runs/diffpeak

logging:
  tensorboard: true
  log_every: 10
  flush_secs: 30

data:
  root: DeepGlobe_Road
  train_split: splits/protocol_v1/train.json
  val_split: splits/protocol_v1/val.json
  num_workers: 4
  augment: true
  ridge_config: {center_radius: 1.0, boundary_band: 2.0, epsilon: 0.000001}

model:
  sam_checkpoint: checkpoints/sam2.1_hiera_base_plus.pt
  sam_config: configs/sam2.1/sam2.1_hiera_b+.yaml
  sam_architecture: sam2.1_hiera_base_plus
  sam_apply_postprocessing: false
  dit:
    in_channels: 1
    patch_size: 8
    hidden_size: 256
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    condition_channels: [64, 128, 256, 256]
    # 延续旧吞吐配置作为起点；新协议尚需重新实测显存和吞吐。
    gradient_checkpointing: false

diffusion:
  latent_channels: 1
  timesteps: 1000
  sampling_steps: 20
  min_std: 0.02

# 对终端场裁剪后以 U=scale*H 输入冻结 SAM，padding 固定为0。
# scale=1 是待验证初值，需先用标注场接口诊断在验证集选择。
prompt:
  scale: 1.0
  terminal_mapping: clamp

train:
  batch_size: 2
  accumulation_steps: 2
  amp: true
  amp_init_scale: 1024.0
  weight_decay: 0.01
  grad_clip: 1.0
  heat_weight: 0.1
  aux_weight: 0.2
  save_every: 1
  warmup_steps: 0
  warmup_ratio: 0.05
  min_lr_ratio: 0.05

stages:
  ABC: {epochs: 60, lr: 0.0001, batch_size: 4, accumulation_steps: 1, num_workers: 4}
  D: {epochs: 10, lr: 0.0000003, batch_size: 1, accumulation_steps: 1, warmup_ratio: 0.1, min_lr_ratio: 0.1}

rl:
  algorithm: grpo
  group_size: 4
  # 单通道联合 SUM log-prob 尺度改变；以下为待校准初值。
  ppo_clip: 0.0001
  kl_weight: 0.01
  # ABC 场生成锚定（扩散 + 场重建 + 辅助），不含 SAM 分割损失；设0关闭。
  anchor_weight: 0.01
  update_epochs: 1
  advantage_std_delta: 0.0001
  amp_init_scale: 64.0

reward:
  iou_weight: 0.6
  cldice_weight: 0.4
  path_weight: 0.0
  point_cost: 0.0
  path_samples: 32
  path_match_radius: 8

inference:
  threshold: 0.5
