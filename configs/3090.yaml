# 单通道有符号道路山脊场；旧双通道快照禁止直接 resume。
training_protocol: signed_ridge_v1
target_representation: signed_ridge_v1
generative_process: conditional_flow_matching_v1
sam_frozen: true
seed: 42
output_dir: runs/diffpeak

logging:
  tensorboard: true
  log_every: 10
  flush_secs: 30

data:
  root: DeepGlobe_Road
  train_split: splits/protocol_v1/train.json
  val_split: splits/protocol_v1/val.json
  num_workers: 4
  augment: true
  ridge_config: {center_radius: 1.0, boundary_band: 2.0, epsilon: 0.000001}

model:
  sam_checkpoint: checkpoints/sam2.1_hiera_base_plus.pt
  sam_config: configs/sam2.1/sam2.1_hiera_b+.yaml
  sam_architecture: sam2.1_hiera_base_plus
  sam_apply_postprocessing: false
  # 连续时间四尺度 ConditionalUNet；旧 model.dit/扩散配置会被显式拒绝。
  denoiser_architecture: conditional_unet_flow_v1
  unet:
    in_channels: 1
    out_channels: 1
    base_channels: 64
    channel_mults: [1, 2, 4, 4]
    num_res_blocks: 2
    # 仅在 level3（默认 32x32）启用注意力。
    attention_levels: [3]
    num_heads: 8
    condition_channels: [64, 128, 256, 256]
    # ABC 仍需对完整采样分割反传；按显存/吞吐实测量调整。
    gradient_checkpointing: true
    # UNet 内部把连续时间 [0,1] 映射到时间嵌入尺度。
    time_scale: 1000.0

flow_matching:
  latent_channels: 1
  sampling_steps: 20
  # 所有步（含末步）的随机积分策略方差系数；std=policy_std*sqrt(dt)。
  policy_std: 0.02
  solver: heun
  time_scale: 1000.0
  field_loss_min_time: 0.5

# 对终端场裁剪后以 U=scale*H 输入冻结 SAM，padding 固定为0。
# scale=1 是待验证初值，需先用标注场接口诊断在验证集选择。
prompt:
  scale: 1.0
  terminal_mapping: clamp

train:
  batch_size: 2
  accumulation_steps: 2
  amp: true
  amp_init_scale: 1024.0
  weight_decay: 0.01
  grad_clip: 1.0
  seg_weight: 1.0
  sampled_seg_weight: 1.0
  heat_weight: 0.1
  aux_weight: 0.2
  cldice_weight: 0.2
  save_every: 1
  val_every: 1
  warmup_steps: 0
  warmup_ratio: 0.05
  min_lr_ratio: 0.05

stages:
  ABC: {epochs: 60, lr: 0.00003, batch_size: 4, accumulation_steps: 1, num_workers: 8}
  D: {epochs: 10, lr: 0.0000003, batch_size: 1, accumulation_steps: 1, warmup_ratio: 0.1, min_lr_ratio: 0.1}

rl:
  algorithm: grpo
  group_size: 4
  # 随机 Flow Matching 积分的 GRPO 裁剪半径；以下为待校准初值。
  ppo_clip: 0.0001
  kl_weight: 0.01
  # 完整 ABC 监督锚定（flow + 场重建 + 辅助 + 两条分割监督）；设0关闭。
  anchor_weight: 0.01
  update_epochs: 1
  advantage_std_delta: 0.0001
  amp_init_scale: 64.0

reward:
  iou_weight: 0.6
  cldice_weight: 0.4
  path_weight: 0.0
  point_cost: 0.0
  path_samples: 32
  path_match_radius: 8

inference:
  threshold: 0.5
