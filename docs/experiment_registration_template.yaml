# 实验登记模板，不是 train.py 配置；不要传给 --config。
# 复制后填写 null 项；完整训练 YAML 另从 configs/3090.yaml 派生。
# 规则见 experimental_protocol.md；未在 3090 上实测的数据不得填写为实测值。
# 目标骨干为 SAM2.1 Hiera-B+（官方配置 configs/sam2.1/sam2.1_hiera_b+.yaml，
# 权重 sam2.1_hiera_base_plus.pt）。SAM1 的 checkpoint、快照和探针数据不适用。
protocol:
  version: protocol_v1_draft
  status: draft  # 仅全部必填项已确认后改为 frozen
  frozen_at: null
  code_commit: null
  workspace_diff_archive: null

data:
  dataset_version: null
  grouping_rule: null
  duplicate_check_report: null
  geographic_independence: null
  split_seed: 42
  split_generation_command: null  # 例：python scripts/prepare_splits.py --root DeepGlobe_Road --output splits/protocol_v1 --val-fraction 0.1 --test-fraction 0.1 --seed 42
  train: {manifest: null, sha256: null, count: null}
  val: {manifest: null, sha256: null, count: null}
  test: {manifest: null, sha256: null, count: null}
  test_previously_used: null  # true/false；当前诊断记录见 experimental_protocol.md 第 2 节
  test_usage_history: null
  test_untouched_claim_basis: null

environment:
  host: seetacloud2
  gpu: NVIDIA RTX 3090 24GB
  gpu_verified: false
  cpu_quota_vcpus: 14
  ram_gib: 90
  shm_gib: 45
  thread_policy: null  # 探针默认 --cpu-threads 2 --interop-threads 1；记录 OMP/MKL/inter-op 实际线程
  python: null
  pytorch: null
  torchvision: null
  cuda_runtime: null
  driver: null
  dependency_lock: null
  power_clock_policy: null
  precision: null
  tf32_policy: null
  deterministic_policy: null

experiment:
  method: null
  implementation_commit: null
  factor_under_test: null
  comparison_track: null  # data_exposure / equal_compute / mechanism / diagnostic
  backbone: sam2.1_hiera_b+
  sam2_config: configs/sam2.1/sam2.1_hiera_b+.yaml
  sam2_source_commit: 2b90b9f5ceec907a1c18123530e92e794ad901a4
  sam2_checkpoint: sam2.1_hiera_base_plus.pt
  pretrained_source: "https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_base_plus.pt"
  pretrained_sha256: null
  trainable_modules: null
  parent_checkpoint: null
  parent_sha256: null
  training_config: null
  training_config_sha256: null
  training_seeds: [42, 43, 44]

budget:
  # 阶段数值从 configs/3090.yaml 派生；预实验后填入冻结值，不在此复制候选表。
  # 未在 3090 上实测的数值不得填为实测值；总曝光随阶段缩短同步改动。
  stages:
    A: {epochs: null, lr: null}
    B: {epochs: null, lr: null}
    C: {epochs: null, lr: null}
    D: {epochs: null, lr: null, warmup_ratio: null, min_lr_ratio: null}
  max_dataset_passes: null  # 由 M0 预实验冻结，不预设固定 95
  abc_micro_batch: 1
  abc_accumulation: 4
  d_micro_batch: 1
  validation_batch: 1
  num_workers: null  # 从本次实际训练 YAML 填入，资源证据见 probe_3090.md
  grpo_group_size: 4
  grpo_update_epochs: 1
  gpu_hours_cap: null  # 等计算轨道必须预先填写统一 H
  wall_time_boundary: exclusive_gpu_training_process_including_data_validation_save
  tuning_candidates_per_method: 3
  tuning_seed: 2026
  tuning_budget_per_candidate: null
  tuning_history_archive: null

selection:
  metric: macro_iou
  validation_every_dataset_passes: null  # 候选 5，预实验后冻结；所有方法必须相同
  include_final_epoch: true
  tie_breaker: earliest_checkpoint
  stage_handoff: stage_best
  validation_rng_isolated_from_training: null  # 当前实现仍用训练 seed，须修复/核实后填 true
  per_sample_eval_seed_algorithm: null
  evaluation_seed: 2024
  validation_opportunity_count: null

inference:
  # 从冻结的 configs/3090.yaml 复制实际值；未实测不保证数值最优。
  longest_side: 1024
  heatmap_size: 256
  sampling_steps: 20
  candidates_per_image: 1
  min_std: 0.02
  peaks: {sigma: 0.5, h: 0.05, threshold: 0.3, min_distance: 4}
  segmentation_threshold: 0.5
  tta: false
  ensembling: false
  geometry_restore_rule: null
  interpolation_rule: null
  padding_exclusion_verified: null
  evaluation_space: original_image
  empty_mask_rule: both_empty_1_otherwise_single_empty_0

pilot:
  probe_report: docs/probe_3090.md  # SAM2 A/B/C 与 D 系统检查；完整预算待补
  probe_script: scripts/probe_3090.py
  loader_benchmark_script: scripts/benchmark_loader.py
  confirmation_script: scripts/confirm_probe.py
  real_sam2_checkpoint_verified: true  # SHA-256 见报告；仅开发探针
  full_resolution_verified: true  # 1024/256；A/B 及 C/D 系统检查
  representative_train_subset_manifest: null
  per_stage_measurements: null  # A/B/C 与 D 系统检查已有；D 完整预算和正式长度待补
  checkpoint_resume_verified: false
  inference_repeatability_verified: false
  projected_total_gpu_hours: null
  approved_configuration_rationale: null

outputs:
  training_logs: null
  checkpoints: null
  per_image_metrics: null
  summary_metrics: null
  efficiency_measurements: null
  failed_runs_and_cost: null
  deviations_from_protocol: null
