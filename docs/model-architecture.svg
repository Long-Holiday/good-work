<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1490" role="img" aria-labelledby="title desc">
<title id="title">DiffPeak 模型结构</title><desc id="desc">当前 signed_ridge_v1 协议：RGB 与冻结 SAM2 特征进入可训练条件编码器，条件 DiT 生成单通道山脊场，冻结 SAM2 通过密集提示输出道路分割。下方展示 ABC 监督训练、DiT 内部和 D 阶段。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<rect width="1440" height="1490" fill="#f6f9fb"/>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#183443" color="#31556a">
<text x="48" y="56" font-size="30" font-weight="700">DiffPeak · 从遥感图像到道路分割</text><text x="48" y="88" font-size="16">当前代码结构 / signed_ridge_v1 / 基于 4d78280 / 形状均省略 batch 维 B；C × H × W</text>
<rect x="48" y="112" width="20" height="20" rx="3" fill="#e4eff7" stroke="#31556a"/><text x="80" y="128" font-size="16">可训练模块</text><rect x="240" y="112" width="20" height="20" rx="3" fill="#edf0f2" stroke="#52636c" stroke-dasharray="5 3"/><text x="272" y="128" font-size="16">冻结 SAM2 模块</text><text x="540" y="128" font-size="16">实线：前向数据流　虚线箭头：分割损失的输入梯度回传</text>
<rect x="48" y="165" width="1344" height="630" rx="10" fill="#ffffff" stroke="#bdccd5"/>
<text x="72" y="199" font-size="21" font-weight="700">主链路：学习生成可供 SAM2 使用的密集提示</text>
<rect x="80" y="230" width="220" height="84" rx="6" fill="#ffffff" stroke="#31556a"/><text x="100" y="262" font-size="19" font-weight="700">RGB 遥感图像</text><text x="100" y="291" font-size="16">3 × 1024 × 1024 / [0, 1]</text>
<rect x="80" y="380" width="260" height="132" rx="6" fill="#edf0f2" stroke="#52636c" stroke-dasharray="6 4"/><text x="100" y="413" font-size="19" font-weight="700">SAM2.1 Hiera-B+ + FPN</text><text x="100" y="444" font-size="16">图像编码 / no_grad</text><text x="100" y="472" font-size="16">low: 256 × 64 × 64</text><text x="100" y="496" font-size="16">high: 256 × 256² / 256 × 128²</text>
<rect x="420" y="230" width="360" height="164" rx="6" fill="#e4eff7" stroke="#31556a"/><text x="440" y="263" font-size="20" font-weight="700">ConditionEncoder 条件编码器</text><text x="440" y="295" font-size="16">RGB 细节卷积 + SAM 低/高分辨率特征</text><text x="440" y="325" font-size="16">C256: 64 × 256²　 C128: 128 × 128²</text><text x="440" y="353" font-size="16">C64: 256 × 64²　 C32: 256 × 32²</text><text x="440" y="379" font-size="15">辅助头：2 × 256²（道路 / 中心线）</text>
<rect x="420" y="459" width="360" height="110" rx="6" fill="#e4eff7" stroke="#31556a"/><text x="440" y="492" font-size="20" font-weight="700">条件 DiT + 扩散调度</text><text x="440" y="524" font-size="16">输入：带噪场 z_t、时间步 t、四尺度条件</text><text x="440" y="550" font-size="16">每次预测 ε；DDIM 采样重复调用 20 次</text>
<rect x="420" y="625" width="360" height="90" rx="6" fill="#ffffff" stroke="#31556a"/><text x="440" y="657" font-size="20" font-weight="700">生成的有符号山脊场 H</text><text x="440" y="689" font-size="16">1 × 256 × 256 / [-1, 1]，不是最终掩码</text>
<rect x="925" y="625" width="385" height="90" rx="6" fill="#edf0f2" stroke="#52636c" stroke-dasharray="6 4"/><text x="945" y="657" font-size="20" font-weight="700">SAM2 提示编码器</text><text x="945" y="688" font-size="16">密集 mask 提示 U = s × H；无点 / 无框</text>
<rect x="925" y="380" width="385" height="155" rx="6" fill="#edf0f2" stroke="#52636c" stroke-dasharray="6 4"/><text x="945" y="413" font-size="20" font-weight="700">SAM2 掩码解码器</text><text x="945" y="445" font-size="16">图像 low + 提示 embedding + 图像位置编码</text><text x="945" y="474" font-size="16">原始 high 经冻结 conv_s0 / conv_s1：</text><text x="945" y="502" font-size="16">32 × 256² 和 64 × 128²，参与细节恢复</text>
<rect x="965" y="230" width="305" height="84" rx="6" fill="#ffffff" stroke="#31556a"/><text x="985" y="262" font-size="19" font-weight="700">最终道路分割</text><text x="985" y="291" font-size="16">1 × 1024² logits → sigmoid → 阈值</text>
<g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"><path d="M300 272 H420"/><path d="M190 314 V380"/><path d="M340 426 H380 V355 H420"/><path d="M340 470 H925"/><path d="M600 394 V459"/><path d="M600 569 V625"/><path d="M780 670 H925"/><path d="M1117 625 V535"/><path d="M1117 380 V314"/></g>
<text x="356" y="254" font-size="14">RGB</text><text x="358" y="414" font-size="14">特征</text><text x="791" y="654" font-size="14">固定尺度 s</text><text x="640" y="450" font-size="14">图像特征旁路（冻结）</text>
<g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"><path d="M1310 460 H1355 V752 H600 V715"/><path d="M400 674 V514 H420"/><path d="M400 510 V320 H420"/></g><text x="800" y="777" font-size="15">ABC：L_seg 的梯度穿过冻结 SAM 回到 H，再回到 DiT 和条件编码器</text>
<rect x="48" y="825" width="790" height="345" rx="10" fill="#ffffff" stroke="#bdccd5"/><text x="72" y="859" font-size="21" font-weight="700">DiT 内部：热图切块，图像条件相加，时间步调制</text>
<rect x="76" y="886" width="220" height="65" rx="5" fill="#e4eff7" stroke="#31556a"/><text x="92" y="913" font-size="16">z_t: 1 × 256² → Conv 8/8</text><text x="92" y="938" font-size="15">32 × 32 = 1024 tokens</text>
<rect x="76" y="982" width="220" height="85" rx="5" fill="#e4eff7" stroke="#31556a"/><text x="92" y="1009" font-size="16">四尺度各自 1×1 投影</text><text x="92" y="1034" font-size="15">对齐 256² 后相加 → 切块</text><text x="92" y="1056" font-size="15">条件 tokens + 固定 2D 位置</text>
<rect x="355" y="907" width="214" height="139" rx="5" fill="#e4eff7" stroke="#31556a"/><text x="372" y="936" font-size="17" font-weight="700">Transformer × 6</text><text x="372" y="964" font-size="15">宽度 256 / 8 个头</text><text x="372" y="989" font-size="15">adaLN → Attention → 残差</text><text x="372" y="1014" font-size="15">adaLN → MLP(×4) → 残差</text><text x="372" y="1036" font-size="14">时间步生成 shift / scale / gate</text>
<rect x="630" y="907" width="180" height="139" rx="5" fill="#e4eff7" stroke="#31556a"/><text x="646" y="937" font-size="17" font-weight="700">最终 adaLN + Linear</text><text x="646" y="968" font-size="15">每 token 输出 8×8×1</text><text x="646" y="997" font-size="15">unpatchify → ε_pred</text><text x="646" y="1026" font-size="15">形状 1 × 256²</text>
<g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"><path d="M296 919 H355"/><path d="M296 1024 H325 V970 H355"/><path d="M569 976 H630"/><path d="M460 1112 V1046"/></g><text x="315" y="1110" font-size="16">t → 正弦编码 → MLP → 每层时间条件</text><text x="76" y="1145" font-size="15">注意：图像条件以 token 加法注入；这里没有图像条件 cross-attention。</text>
<rect x="866" y="825" width="526" height="345" rx="10" fill="#ffffff" stroke="#bdccd5"/><text x="890" y="859" font-size="21" font-weight="700">ABC：同一次训练中的两条场路径</text>
<text x="890" y="902" font-size="17" font-weight="700">重建路径（训练期，见过目标的加噪版本）</text><text x="890" y="934" font-size="16">标注 M → 目标 H* → 随机 t 加噪 → DiT 一次</text><text x="890" y="965" font-size="16">→ 重建 Ĥ → SAM → L_seg</text><text x="890" y="994" font-size="15">同时监督噪声 L_diff 和分区场重建 L_heat</text>
<text x="890" y="1041" font-size="17" font-weight="700">生成路径（与推理的出发点相同）</text><text x="890" y="1073" font-size="16">纯高斯噪声 → 可微 20 步采样 → H_gen</text><text x="890" y="1104" font-size="16">→ SAM → L_sampled_seg</text><text x="890" y="1140" font-size="15">辅助头另有 L_aux；推理不使用辅助头或标注。</text>
<rect x="48" y="1200" width="1344" height="210" rx="10" fill="#ffffff" stroke="#bdccd5"/><text x="72" y="1236" font-size="21" font-weight="700">D：可选 GRPO 后训练（主模型结构不变）</text>
<rect x="76" y="1264" width="344" height="72" rx="5" fill="#e4eff7" stroke="#31556a"/><text x="94" y="1292" font-size="17">同图多次采样 → 多个场 → 冻结 SAM</text><text x="94" y="1318" font-size="15">记录各步 state / action / old log-prob</text>
<rect x="482" y="1264" width="375" height="72" rx="5" fill="#ffffff" stroke="#31556a"/><text x="500" y="1292" font-size="17">确定性掩码 → 奖励 → 组内相对优势</text><text x="500" y="1318" font-size="15">奖励是评分，不对阈值掩码直接求导</text>
<rect x="920" y="1264" width="440" height="72" rx="5" fill="#e4eff7" stroke="#31556a"/><text x="938" y="1292" font-size="17">重放扩散轨迹 → 更新条件编码器 + DiT</text><text x="938" y="1318" font-size="15">PPO 式裁剪 / 冻结参考策略 KL / 可选 ABC 锚定</text>
<g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"><path d="M420 1300 H482"/><path d="M857 1300 H920"/></g><text x="76" y="1377" font-size="16">SAM 在 ABC / D 均不更新。参考条件编码器与参考 DiT 仅用于 D 的 KL 约束，不属于普通推理链路。</text>
<text x="48" y="1450" font-size="15">对应实现：conditioning.py · dit.py · diffusion.py · sam.py · engine.py · joint_rl.py（均位于 diffpeak/）</text>
</g></svg>
